        O Flamengo não nasceu como um time de futebol, mas sim como um clube de remo.

Foi fundado em 17 de novembro de 1895 por um grupo de jovens no bairro do Flamengo, no Rio de Janeiro.

Curiosidade: As cores originais eram azul e ouro, mas como os tecidos desbotavam muito com o sal do mar e eram caros, em 1896 mudaram para o vermelho e preto
(rubro-negro).
Entre o fim dos anos 70 e o início dos anos 80, o Flamengo viveu a fase mais gloriosa da sua história com o maior ídolo do clube: Zico (o "Galinho de Quintino").

Em 1981, o time comandado por Zico, Adílio, Andrade e companhia conquistou a Copa Libertadores e o Mundial Interclubes, atropelando o Liverpool por 3 a 0 no Japão.
O Flamengo se consolidou como a maior torcida do Brasil (a chamada Nação Rubro-Negra), famosa por lotar o Maracanã.

Nas últimas décadas, voltou a figurar no topo do futebol sul-americano, conquistando múltiplos títulos do Campeonato Brasileiro, Copas do Brasil e novas Copas Libertadores.
